<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Jarvis HUD</title>
  <style>
    :root {
      --cyan: #99ecff;
      --panel: rgba(18, 10, 34, 0.32);
      --border: rgba(170, 130, 255, 0.22);
      --text-dim: rgba(220, 210, 255, 0.82);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(120, 70, 255, 0.18), transparent 22%),
        radial-gradient(circle at 80% 25%, rgba(180, 80, 255, 0.14), transparent 20%),
        radial-gradient(circle at 50% 70%, rgba(90, 40, 180, 0.22), transparent 26%),
        linear-gradient(to bottom, #090612 0%, #120a22 35%, #060814 100%);
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      color: var(--cyan);
    }

    body {
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at center, rgba(130, 90, 255, 0.12), rgba(25, 10, 50, 0.18) 35%, rgba(4, 6, 16, 0.72) 78%),
        radial-gradient(circle at 50% 50%, rgba(90, 180, 255, 0.08), transparent 30%),
        linear-gradient(to bottom, rgba(18, 10, 34, 0.92), rgba(5, 7, 16, 0.97));
    }

    .hud::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 25% 70%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 35%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 80%, rgba(255,255,255,0.85) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 22%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 62%, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      opacity: 0.55;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.02),
        0 0 24px rgba(140,100,255,0.12);
      backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-shadow: 0 0 12px rgba(150,100,255,0.45);
    }

    .top-left-1 { top: 28px; left: 32px; }
    .top-left-2 { top: 78px; left: 32px; }
    .top-left-3 { top: 128px; left: 32px; }

    .top-right-1 { top: 28px; right: 32px; text-align: right; }
    .top-right-2 { top: 78px; right: 32px; text-align: right; }
    .top-right-3 { top: 128px; right: 32px; text-align: right; }

  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;

  /* moves the orb + center text a bit to the right */
    transform: translateX(120px);
}

    .core-wrap {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .core-wrap::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(160, 90, 255, 0.16), rgba(90, 180, 255, 0.06), transparent 68%);
      filter: blur(18px);
      z-index: 0;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(170, 130, 255, 0.22);
      box-shadow: 0 0 20px rgba(140,100,255,0.10);
    }

    .r1 { width: 260px; height: 260px; animation: spin 18s linear infinite; }
    .r2 { width: 210px; height: 210px; animation: spinReverse 12s linear infinite; }
    .r3 { width: 160px; height: 160px; animation: pulseRing 1.6s ease-in-out infinite; }

    .tick-ring {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg 8deg,
          rgba(180,140,255,0.22) 8deg 9deg,
          transparent 9deg 24deg,
          rgba(170,130,255,0.16) 24deg 25deg,
          transparent 25deg 42deg,
          rgba(140,220,255,0.16) 42deg 43deg,
          transparent 43deg 360deg
        );
      mask: radial-gradient(circle, transparent 70%, black 71%);
      -webkit-mask: radial-gradient(circle, transparent 70%, black 71%);
      opacity: 0.75;
      animation: spin 24s linear infinite;
    }

    .core {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,160,255,1), rgba(70,40,130,0.72));
      box-shadow:
        0 0 18px rgba(200,160,255,0.95),
        0 0 58px rgba(140,100,255,0.30),
        inset 0 0 24px rgba(255,255,255,0.12);
      animation: pulseCore 1.45s ease-in-out infinite;
      z-index: 2;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2px;
      text-shadow: 0 0 14px rgba(180,140,255,0.65);
      max-width: 520px;
      text-align: center;
      padding: 0 16px;
      line-height: 1.3;
    }

    .substatus {
      margin-top: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    .caption {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(230,220,255,0.72);
      opacity: 0.78;
    }

    .log-panel {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      max-height: 140px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(20, 12, 40, 0.34);
      box-shadow: 0 0 24px rgba(140,100,255,0.12);
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .log-title {
      font-size: 11px;
      letter-spacing: 1.3px;
      color: rgba(230,220,255,0.85);
      margin-bottom: 8px;
    }

    .log-entry {
      font-size: 12px;
      margin-bottom: 6px;
      color: rgba(220,235,255,0.95);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-role {
      color: #d6a6ff;
      font-weight: 700;
      margin-right: 6px;
    }

    .camera-panel {
      position: absolute;
      left: 32px;
      bottom: 10px;
      width: 300px;
      height: 175px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(20, 12, 40, 0.28);
      box-shadow: 0 0 24px rgba(140,100,255,0.12);
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .camera-label {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 2;
      font-size: 10px;
      letter-spacing: 1.2px;
      color: rgba(230, 220, 255, 0.82);
      text-shadow: 0 0 10px rgba(150,100,255,0.35);
    }

    #cameraFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.92;
      filter: brightness(0.95) contrast(1.1) saturate(0.95) hue-rotate(6deg);
      transform: scaleX(-1);
    }

    .idle .core { background: radial-gradient(circle, rgba(200,160,255,0.95), rgba(70,40,130,0.65)); }
    .listening .core { background: radial-gradient(circle, rgba(160,255,255,1), rgba(80,60,190,0.86)); }
    .thinking .core { background: radial-gradient(circle, rgba(255,210,105,1), rgba(148,88,20,0.80)); }
    .speaking .core { background: radial-gradient(circle, rgba(220,170,255,1), rgba(120,60,180,0.86)); }

    @keyframes pulseCore {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.65; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    <div class="panel top-left-1">JARVIS SYSTEM</div>
    <div class="panel top-left-2" id="statePanel">STATE: IDLE</div>
    <div class="panel top-left-3" id="cameraPanelStatus">CAMERA: STARTING</div>

    <div class="panel top-right-1">VOICE ASSISTANT ONLINE</div>
    <div class="panel top-right-2" id="clockPanel">--:--</div>
    <div class="panel top-right-3" id="memoryPanel">MEMORY: UNKNOWN</div>

    <div class="log-panel">
      <div class="log-title">LIVE TRANSCRIPT</div>
      <div id="logContainer"></div>
    </div>

    <div class="center idle" id="wrap">
      <div class="core-wrap">
        <div class="tick-ring"></div>
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"></div>
      </div>
      <div class="status" id="label">Say "Hey Jarvis"</div>
      <div class="substatus" id="subLabel">Awaiting wake phrase</div>
      <div class="caption">Voice interface ready</div>
    </div>

    <div class="camera-panel">
      <div class="camera-label">VISION FEED</div>
      <video id="cameraFeed" autoplay playsinline muted></video>
      <canvas id="cameraCanvas" style="display:none;"></canvas>
    </div>
  </div>

  <script>
    const fs = require("fs");
    const os = require("os");
    const path = require("path");

    const statusPath = path.join(os.homedir(), "jarvis_status.json");
    const logPath = path.join(os.homedir(), "jarvis_log.json");
    const memoryPath = path.join(os.homedir(), "jarvis_memory.json");
    const cameraFramePath = path.join(os.homedir(), "jarvis_camera_snapshot.jpg");
    const cameraMetaPath = path.join(os.homedir(), "jarvis_camera_meta.json");

    const wrap = document.getElementById("wrap");
    const label = document.getElementById("label");
    const subLabel = document.getElementById("subLabel");
    const statePanel = document.getElementById("statePanel");
    const clockPanel = document.getElementById("clockPanel");
    const memoryPanel = document.getElementById("memoryPanel");
    const cameraPanelStatus = document.getElementById("cameraPanelStatus");
    const logContainer = document.getElementById("logContainer");
    const video = document.getElementById("cameraFeed");
    const canvas = document.getElementById("cameraCanvas");

    let frameCounter = 0;

    function readStatus() {
      try {
        return JSON.parse(fs.readFileSync(statusPath, "utf-8"));
      } catch {
        return { state: "idle", text: 'Say "Hey Jarvis"' };
      }
    }

    function readLog() {
      try {
        return JSON.parse(fs.readFileSync(logPath, "utf-8"));
      } catch {
        return [];
      }
    }

    function updateClock() {
      const now = new Date();
      clockPanel.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function updateUI() {
      const status = readStatus();
      const state = status.state || "idle";
      const text = status.text || 'Say "Hey Jarvis"';

      wrap.className = `center ${state}`;
      label.textContent = text;

      subLabel.textContent =
        state === "idle" ? "Awaiting wake phrase" :
        state === "listening" ? "Awaiting command" :
        state === "thinking" ? "Processing request" :
        state === "speaking" ? "Responding" :
        "System online";

      statePanel.textContent = `STATE: ${state.toUpperCase()}`;
      updateClock();
    }

    function updateLog() {
      const logs = readLog();
      logContainer.innerHTML = logs.slice(-5).reverse().map(entry => `
        <div class="log-entry">
          <span class="log-role">${entry.role.toUpperCase()}:</span>
          <span>${entry.text}</span>
        </div>
      `).join("");
    }

    function updateMemoryPanel() {
      try {
        const data = JSON.parse(fs.readFileSync(memoryPath, "utf-8"));
        memoryPanel.textContent = data.enabled ? "MEMORY: ON" : "MEMORY: OFF";
      } catch {
        memoryPanel.textContent = "MEMORY: UNKNOWN";
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        cameraPanelStatus.textContent = "CAMERA: ACTIVE";
      } catch (err) {
        console.error("Camera error:", err);
        cameraPanelStatus.textContent = "CAMERA: DENIED";
      }
    }

    function saveCameraFrame() {
      try {
        if (!video || video.readyState < 2) return;
        if (!video.videoWidth || !video.videoHeight) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
        const base64Data = dataUrl.replace(/^data:image\/jpeg;base64,/, "");
        const buffer = Buffer.from(base64Data, "base64");

        fs.writeFileSync(cameraFramePath, buffer);

        frameCounter += 1;
        fs.writeFileSync(
          cameraMetaPath,
          JSON.stringify({
            updated_at: Date.now(),
            frame_id: frameCounter,
            width: canvas.width,
            height: canvas.height
          }),
          "utf-8"
        );

        cameraPanelStatus.textContent = `CAMERA: LIVE ${frameCounter}`;
      } catch (err) {
        console.error("Save camera frame error:", err);
      }
    }

    updateUI();
    updateLog();
    updateMemoryPanel();
    setInterval(updateUI, 140);
    setInterval(updateLog, 300);
    setInterval(updateMemoryPanel, 500);
    setInterval(updateClock, 1000);
    setInterval(saveCameraFrame, 250);
    startCamera();
  </script>
</body>
</html>
